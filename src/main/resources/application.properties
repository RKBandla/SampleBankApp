spring.application.name=bankapp-java-api-backend

# ---- MongoDB Atlas ----
# The connection string is read from the MONGODB_URI environment variable,
# so the username/password are never committed to git.
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=bankapp

# ---- JWT ----
# Set JWT_SECRET (at least 32 characters) as an environment variable.
# The default below is only for local practice.
jwt.secret=${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
# Token valid for 1 hour
jwt.expiration-ms=3600000
