spring.application.name=bankapp-java-api-backend

# ---- MongoDB Atlas ----
# The connection string is read from the MONGODB_URI environment variable,
# so the username/password are never committed to git.
spring.data.mongodb.uri=${MONGODB_URI}
# Step 5 uses a fresh database (older steps stored customers without roles/accounts)
spring.data.mongodb.database=samplebank

# ---- JWT ----
# Set JWT_SECRET (at least 32 characters) as an environment variable.
# The default below is only for local practice.
jwt.secret=${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
# Token valid for 1 hour
jwt.expiration-ms=3600000

# ---- Admin + demo data ----
# The admin login is created at startup (username "admin"). Change the password with ADMIN_PASSWORD.
app.admin-password=${ADMIN_PASSWORD:Admin@123}
# Adds 3 demo customers (with accounts) the first time the database is empty
app.seed-demo-data=true
